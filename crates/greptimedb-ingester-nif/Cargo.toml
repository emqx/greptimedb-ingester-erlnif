[package]
name = "greptimedb-ingester-nif"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
build = "build.rs"

[lib]
name = "greptimedb_nif"
crate-type = ["cdylib"]

[dependencies]
arrow = { version = "58.1", features = ["prettyprint"] }
chrono = "0.4"
futures = "0.3"
greptime-proto = "0.1.0"
greptimedb-ingester = { git = "https://github.com/emqx/greptimedb-ingester-rust", rev = "8b7d137b772f7ff924a5638d172807e3b974ed3b" }
log = "0.4"
rustler = "0.37.0"
serde = "1.0"
serde_json = { version = "1.0", features = ["unbounded_depth"] }
serde_stacker = "0.1"
tokio = { version = "1.40", features = ["full"] }
